<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VZN QG</title>
<meta name="theme-color" content="#0f0b0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffd23f'/><stop offset='.55' stop-color='%23ff6b1a'/><stop offset='1' stop-color='%23d7261e'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='%23160e0c'/><text x='50' y='64' font-size='40' text-anchor='middle' fill='url(%23g)' font-family='Arial Black,Arial' font-weight='900'>VZN</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0c0909; --bg1:#141010; --bg2:#1a1413; --bg3:#261d1b; --bg4:#332623; --bg5:#3f2f2b;
  --tx:#f4ebe7; --tx2:#b3a29c; --tx3:#7d6c66; --line:#2e2320;
  --fire1:#ffd23f; --fire2:#ff8a1f; --fire3:#ff5a1a; --fire4:#d7261e;
  --fire:linear-gradient(135deg,#ffd23f 0%,#ff8a1f 40%,#ff4d1a 75%,#d7261e 100%);
  --ok:#3ddc84; --bad:#ff4d4d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--tx);font:15px/1.45 Outfit,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--tx)}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2b211e;border-radius:4px}
.fire-text{background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent}

/* =================== LOGIN =================== */
#login{position:fixed;inset:0;overflow:auto;background:
  radial-gradient(ellipse 80% 55% at 50% 110%,#ff5a1a55,transparent 70%),
  radial-gradient(ellipse 60% 40% at 50% 100%,#d7261e66,transparent 70%),
  radial-gradient(circle at 50% 30%,#2a1510,#0c0909 70%)}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.login-wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px}
.brand{text-align:center;margin-bottom:18px}
.phoenix{width:170px;height:170px;filter:drop-shadow(0 0 22px #ff6b1a99) drop-shadow(0 0 60px #d7261e55);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brand h1{margin:2px 0 0;font-size:56px;line-height:1;font-weight:900;letter-spacing:.12em;padding-left:.12em}
.brand .tag{margin-top:6px;color:var(--tx2);letter-spacing:.32em;text-transform:uppercase;font-size:12px;font-weight:600;padding-left:.32em}
.card{position:relative;width:100%;max-width:460px;background:#160f0ecc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:26px 24px 24px;box-shadow:0 20px 60px #000a}
.card::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(160deg,#ffb23f88,#ff5a1a22 40%,#ffffff10 60%,#d7261e66);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin:16px 0 8px}
.card label:first-child{margin-top:0}
.field{width:100%;background:#0c0808;border:1px solid #2e2320;border-radius:10px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--fire2);box-shadow:0 0 0 3px #ff8a1f33}
.avpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avpick button{aspect-ratio:1;border-radius:10px;background:#0c0808;border:2px solid #2e2320;padding:4px;transition:transform .12s,border-color .12s}
.avpick button:hover{transform:translateY(-2px);border-color:#5a403a}
.avpick button.sel{border-color:var(--fire2);box-shadow:0 0 0 3px #ff8a1f33,0 0 18px #ff6b1a55;background:#24140f}
.avpick img{width:100%;height:100%;image-rendering:pixelated;display:block}
.preview{display:flex;align-items:center;gap:14px;margin-top:12px;padding:10px 12px;background:#0c0808;border-radius:10px;border:1px dashed #2e2320}
.preview img{width:44px;height:88px;image-rendering:pixelated}
.preview b{display:block;font-size:16px}
.preview span{color:var(--tx2);font-size:13px}
.btn{background:var(--fire);color:#1a0905;border-radius:10px;padding:13px 18px;font-weight:800;letter-spacing:.04em;box-shadow:0 6px 24px #ff5a1a55;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.full{width:100%;margin-top:22px;font-size:16px}
.err{color:#ff7a6b;font-size:13px;margin-top:8px;min-height:18px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{margin-top:18px;color:var(--tx3);font-size:12px;text-align:center}

/* =================== APP =================== */
#app{display:grid;grid-template-columns:72px 248px 1fr 232px;height:100vh;height:100dvh}
#rail{background:var(--bg0);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px}
.railico{width:48px;height:48px;border-radius:16px;background:var(--fire);display:grid;place-items:center;box-shadow:0 0 18px #ff5a1a55}
.railico svg{width:38px;height:38px}
.railsep{width:32px;height:2px;background:var(--line);border-radius:2px}
#side{background:var(--bg1);display:flex;flex-direction:column;min-height:0}
#side header{height:56px;padding:0 14px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#2a140d,transparent)}
#side header .t{font-weight:900;letter-spacing:.1em;font-size:18px}
#side header .t small{display:block;font-size:10px;letter-spacing:.25em;color:var(--tx2);font-weight:600}
#side header button{color:var(--tx2);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
#side header button:hover{background:var(--bg4);color:var(--tx)}
#chanlist{flex:1;overflow-y:auto;padding:6px 8px 16px}
.cat{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--tx3);padding:16px 8px 6px;letter-spacing:.1em}
.ch{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;color:var(--tx2);text-align:left;margin:1px 0;position:relative}
.ch:hover{background:var(--bg3);color:var(--tx)}
.ch.on{background:var(--bg4);color:#fff}
.ch.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--fire)}
.ch .ico{width:20px;text-align:center;color:var(--tx3);font-size:17px;line-height:1}
.ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.unread{color:#fff;font-weight:700}
.ch .badge{background:var(--fire3);color:#fff;font-size:11px;font-weight:800;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.ch .cnt{font-size:11px;color:var(--tx3);font-weight:700}
.vmembers{padding:2px 0 6px 28px}
.vm{display:flex;align-items:center;gap:8px;padding:3px 6px;color:var(--tx2);font-size:14px;border-radius:6px}
.vm .flags{margin-left:auto;font-size:12px;display:flex;gap:4px;align-items:center}
.av{width:24px;height:24px;border-radius:6px;flex:none;position:relative;background:#0c0808;display:inline-block}
.av img{width:100%;height:100%;image-rendering:pixelated;border-radius:inherit;display:block}
.av.speak{box-shadow:0 0 0 2px var(--bg1),0 0 0 4px var(--ok)}
.live{background:var(--fire4);color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;letter-spacing:.04em}

#vpanel{background:#120d0c;border-top:1px solid var(--line);padding:10px 10px 8px}
#vpanel .st{color:var(--ok);font-weight:700;font-size:14px}
#vpanel .where{font-size:12px;color:var(--tx2);margin-bottom:8px}
#vpanel .row{display:flex;gap:6px}
#vpanel .row button{flex:1;background:var(--bg3);border-radius:8px;padding:7px 0;font-size:15px}
#vpanel .row button:hover{background:var(--bg4)}
#vpanel .row button.act{background:var(--fire2);color:#1a0905}
#vpanel .row button.leave{background:#5a1a17;color:#fff}
#mepanel{background:#100b0a;padding:8px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
#mepanel .av{width:34px;height:34px}
#mepanel .who{flex:1;min-width:0}
#mepanel .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mepanel .who span{font-size:12px;color:var(--tx2)}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:var(--tx2);position:relative}
.ibtn:hover{background:var(--bg4);color:var(--tx)}
.ibtn.off::after{content:"";position:absolute;width:22px;height:2px;background:var(--bad);transform:rotate(-45deg);border-radius:2px}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg2)}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700}
#topbar .ico{color:var(--fire2);font-size:20px}
#topbar .desc{font-weight:400;color:var(--tx2);font-size:14px;border-left:1px solid var(--line);padding-left:10px;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn,#membersBtn{display:none}
#topbar .sp{flex:1}

#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:16px 0 8px}
.welcome{padding:8px 16px 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.welcome .big{width:64px;height:64px;border-radius:18px;background:var(--fire);display:grid;place-items:center;font-size:32px;font-weight:900;color:#1a0905;margin-bottom:10px;box-shadow:0 0 24px #ff5a1a44}
.welcome h2{margin:0 0 4px;font-size:28px;font-weight:800}
.welcome p{margin:0;color:var(--tx2)}
.msg{display:flex;gap:14px;padding:2px 16px}
.msg:hover{background:#ffffff06}
.msg.first{margin-top:14px}
.msg .av{width:40px;height:40px;border-radius:10px}
.msg .gut{width:40px;flex:none;font-size:11px;color:var(--tx3);text-align:right;padding-top:3px;visibility:hidden}
.msg:hover .gut{visibility:visible}
.msg .body{min-width:0;flex:1}
.msg .hd b{font-weight:700}
.msg .hd time{font-size:12px;color:var(--tx3);margin-left:6px}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tx a{color:var(--fire1)}
.sysmsg{padding:4px 16px 4px 70px;color:var(--tx3);font-size:13px}
.daysep{display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:12px;font-weight:700;padding:14px 16px 2px}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
#composer{padding:0 16px 18px}
#composer form{background:var(--bg3);border-radius:12px;display:flex;align-items:flex-end;border:1px solid transparent}
#composer form:focus-within{border-color:#ff8a1f55}
#composer textarea{flex:1;background:none;border:0;outline:0;padding:12px 16px;resize:none;max-height:200px}
#composer .send{width:44px;height:44px;color:var(--fire2);font-size:18px}
#typing{height:18px;font-size:12px;color:var(--tx2);padding:2px 18px 0}

#voice{flex:1;display:flex;flex-direction:column;min-height:0;background:#070505}
#grid{flex:1;display:grid;gap:10px;padding:10px;min-height:0;overflow:auto;align-content:center}
.tile{position:relative;background:radial-gradient(circle at 50% 40%,#2a1813,#120c0b);border-radius:14px;overflow:hidden;aspect-ratio:16/9;min-height:0;display:grid;place-items:center;cursor:pointer;border:1px solid #2a1f1c}
.tile.speak{box-shadow:inset 0 0 0 3px var(--ok)}
.tile video{width:100%;height:100%;object-fit:cover;background:#000;position:absolute;inset:0}
.tile.screen video,.tile.focus video{object-fit:contain}
.tile .fig{height:62%;max-height:180px;image-rendering:pixelated;filter:drop-shadow(0 8px 12px #0009)}
.tile.speak .fig{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tile .tag{position:absolute;left:10px;bottom:10px;background:#000b;padding:3px 10px;border-radius:8px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;z-index:1}
.tile.focus{grid-column:1/-1;aspect-ratio:auto;height:100%}
#grid.hasfocus .tile:not(.focus){display:none}
#vbar{flex:none;display:flex;justify-content:center;gap:12px;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:#070505}
#vbar button{width:54px;height:54px;border-radius:50%;background:var(--bg3);font-size:20px;transition:transform .1s}
#vbar button:hover{background:var(--bg4);transform:translateY(-1px)}
#vbar button.act{background:var(--fire);color:#1a0905}
#vbar button.offc{background:#5a1a17}
#vbar button.leave{background:var(--bad);color:#fff}
#vjoin{flex:1;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 100%,#3a160c,#0c0909 65%);padding:16px}
#vjoin .figs{display:flex;justify-content:center;gap:6px;margin-bottom:12px;min-height:90px;align-items:flex-end}
#vjoin .figs img{height:88px;image-rendering:pixelated}
#vjoin h2{margin:0 0 6px;font-size:26px}
#vjoin p{color:var(--tx2);margin:0 0 18px}

#members{background:var(--bg1);overflow-y:auto;padding:8px;border-left:1px solid var(--line)}
.mem{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.mem:hover{background:var(--bg3)}
.mem .av{width:34px;height:34px;border-radius:8px}
.mem .av::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:3px solid var(--bg1)}
.mem .info{min-width:0}
.mem .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .info span{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1311;border:1px solid #ff8a1f55;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 30px #000a;z-index:60;max-width:calc(100% - 32px)}
#overlay{display:none}

@media (max-width:1000px){
  #app{grid-template-columns:72px 248px 1fr}
  #members{display:none;position:fixed;right:0;top:0;bottom:0;width:250px;z-index:30}
  #members.open{display:block}
  #membersBtn{display:grid}
}
@media (max-width:720px){
  #app{grid-template-columns:1fr}
  #rail{display:none}
  #side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none}
  #menuBtn{display:grid}
  #overlay.open{display:block;position:fixed;inset:0;background:#000a;z-index:20}
  #vbar button{width:48px;height:48px}
  .brand h1{font-size:44px}
  .phoenix{width:130px;height:130px}
  .avpick{grid-template-columns:repeat(6,1fr);gap:6px}
}
</style>
</head>
<body>

<!-- Fênix (SVG reutilizado) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pxFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/><stop offset=".35" stop-color="#ff9a1f"/><stop offset=".7" stop-color="#ff4d1a"/><stop offset="1" stop-color="#c41d1d"/>
    </linearGradient>
    <linearGradient id="pxCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffb23f"/>
    </linearGradient>
    <symbol id="phoenix" viewBox="0 0 200 200">
      <g fill="url(#pxFire)">
        <!-- asa direita -->
        <path d="M108 92 C126 70 146 44 190 22 C176 42 172 50 184 54 C164 62 158 70 170 76 C150 82 142 88 150 96 C132 98 122 102 112 112 Z"/>
        <!-- asa esquerda -->
        <path d="M92 92 C74 70 54 44 10 22 C24 42 28 50 16 54 C36 62 42 70 30 76 C50 82 58 88 50 96 C68 98 78 102 88 112 Z"/>
        <!-- cauda em chamas -->
        <path d="M92 128 C84 150 66 164 52 190 C74 178 86 170 94 160 C92 174 94 186 100 199 C106 186 108 174 106 160 C114 170 126 178 148 190 C134 164 116 150 108 128 Z"/>
        <!-- corpo -->
        <path d="M100 58 C114 72 116 104 108 132 C104 140 96 140 92 132 C84 104 86 72 100 58 Z"/>
        <!-- crista -->
        <path d="M100 30 C96 40 92 44 94 54 C90 48 86 46 82 46 C88 52 92 58 100 62 C108 58 112 52 118 46 C114 46 110 48 106 54 C108 44 104 40 100 30 Z"/>
      </g>
      <path fill="url(#pxCore)" d="M100 74 C106 84 107 104 103 122 C101 126 99 126 97 122 C93 104 94 84 100 74 Z" opacity=".9"/>
      <circle cx="104" cy="62" r="2.4" fill="#1a0905"/>
      <path d="M108 63 L116 66 L108 68 Z" fill="#ffe066"/>
    </symbol>
  </defs>
</svg>

<!-- ============ LOGIN ============ -->
<div id="login">
  <canvas id="embers"></canvas>
  <div class="login-wrap">
    <div class="brand">
      <svg class="phoenix"><use href="#phoenix"/></svg>
      <h1 class="fire-text">VZN</h1>
      <div class="tag">Agência · QG Online</div>
    </div>
    <form class="card" id="loginForm" autocomplete="off">
      <label for="inName">Como a equipe te chama?</label>
      <input class="field" id="inName" maxlength="24" required placeholder="Seu nome">
      <label>Escolha seu bonequinho</label>
      <div class="avpick" id="avpick"></div>
      <div class="preview"><img id="pvFig" alt=""><div><b id="pvName">Seu nome</b><span id="pvAv"></span></div></div>
      <label for="inPass">Senha da agência</label>
      <input class="field" id="inPass" type="password" required placeholder="••••">
      <div class="err" id="err"></div>
      <button class="btn" type="submit" style="width:100%;margin-top:6px">ENTRAR NO QG 🔥</button>
    </form>
    <div class="foot">Voz · câmera · tela · chat — grátis e sem limite de tempo</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <nav id="rail">
    <div class="railico" title="VZN Agência"><svg><use href="#phoenix"/></svg></div>
    <div class="railsep"></div>
  </nav>
  <aside id="side">
    <header><div class="t"><span class="fire-text">VZN</span><small>AGÊNCIA</small></div><button id="inviteBtn" title="Copiar link do QG">Convidar</button></header>
    <nav id="chanlist"></nav>
    <div id="vpanel" class="hidden">
      <div class="st">● Voz conectada</div>
      <div class="where" id="vwhere"></div>
      <div class="row">
        <button id="pCam" title="Câmera">📷</button>
        <button id="pScreen" title="Compartilhar tela">🖥️</button>
        <button id="pLeave" class="leave" title="Sair da sala">✕</button>
      </div>
    </div>
    <div id="mepanel">
      <span class="av" id="meAv"></span>
      <div class="who"><b id="meName"></b><span id="meStatus">Online</span></div>
      <button class="ibtn" id="bMic" title="Microfone">🎙️</button>
      <button class="ibtn" id="bDeaf" title="Ouvir os outros">🎧</button>
      <button class="ibtn" id="bOut" title="Sair">⏻</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button class="ibtn" id="menuBtn" title="Canais">☰</button>
      <span class="ico" id="tIco">#</span><span id="tName"></span><span class="desc" id="tDesc"></span>
      <span class="sp"></span>
      <button class="ibtn" id="membersBtn" title="Quem está online">👥</button>
    </div>

    <section id="chat">
      <div id="msgs"></div>
      <div id="typing"></div>
      <div id="composer"><form id="sendForm"><textarea id="inMsg" rows="1" placeholder="Conversar"></textarea><button class="send" type="submit" title="Enviar">➤</button></form></div>
    </section>

    <section id="voice" class="hidden">
      <div id="vjoin">
        <div><div class="figs" id="vjFigs"></div><h2 id="vjTitle"></h2><p id="vjSub"></p><button class="btn" id="vjBtn">Entrar na sala</button></div>
      </div>
      <div id="grid" class="hidden"></div>
      <div id="vbar" class="hidden">
        <button id="vMic" title="Microfone">🎙️</button>
        <button id="vCam" title="Câmera">📷</button>
        <button id="vScreen" title="Compartilhar tela">🖥️</button>
        <button id="vLeave" class="leave" title="Sair da sala">📞</button>
      </div>
    </section>
  </main>

  <aside id="members"></aside>
</div>
<div id="overlay"></div>
<div id="toast" class="hidden"></div>
<div id="audios" class="hidden"></div>

const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16)
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))))
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('')
}
function headGrid(a) {
  const S = a.s, H = a.h, g = Array.from({length: 8}, () => Array(8).fill(S))
  const set = (x, y, c) => { if (x >= 0 && x < 8 && y >= 0 && y < 8) g[y][x] = c }
  const row = (y, x0, x1, c) => { for (let x = x0; x <= x1; x++) set(x, y, c) }
  // sombreado leve da pele
  for (let y = 0; y < 8; y++) { set(0, y, shade(S, -.08)); set(7, y, shade(S, -.08)) }
  if (a.style === 'robot') {
    for (let y = 0; y < 8; y++) row(y, 0, 7, (x => x)(S))
    row(0, 0, 7, shade(S, -.25)); row(7, 0, 7, shade(S, -.25))
    for (let y = 0; y < 8; y++) { set(0, y, shade(S, -.25)); set(7, y, shade(S, -.25)) }
    row(3, 1, 6, '#1d2226'); set(2, 3, a.e); set(5, 3, a.e); set(1, 3, shade(a.e, -.4)); set(6, 3, shade(a.e, -.4))
    row(5, 2, 5, '#1d2226'); set(3, 5, '#ffcf3f'); set(4, 5, '#ff4d1a')
    set(3, 0, '#ff4d1a'); set(4, 0, '#ff4d1a')
    return g
  }
  if (a.style === 'ninja') {
    for (let y = 0; y < 8; y++) row(y, 0, 7, H)
    row(3, 1, 6, S); row(4, 1, 6, S)
    set(2, 4, '#fff'); set(1, 4, a.e); set(5, 4, a.e); set(6, 4, '#fff')
    row(2, 0, 7, a.band); set(7, 3, a.band)
    return g
  }
  // cabelo
  if (a.style !== 'bald') {
    row(0, 0, 7, H); row(1, 0, 7, H)
    set(0, 2, H); set(7, 2, H)
    if (a.style === 'short') { set(1, 2, H); set(6, 2, H); set(0, 3, H); set(7, 3, H) }
    if (a.style === 'long') { for (let y = 2; y < 8; y++) { set(0, y, H); set(7, y, H) } set(1, 2, H); set(2, 2, H); set(5, 2, H); set(6, 2, H); set(1, 7, H); set(6, 7, H) }
    if (a.style === 'afro') { row(2, 0, 7, H); for (let y = 3; y < 6; y++) { set(0, y, H); set(7, y, H) } }
    if (a.style === 'flame') { row(2, 0, 2, H); row(2, 5, 7, H); set(0, 3, H); set(7, 3, H); set(1, 0, a.h2); set(3, 0, a.h2); set(6, 0, a.h2); set(2, 1, a.h2); set(5, 1, a.h2) }
    if (a.style === 'cap') { row(0, 0, 7, a.cap); row(1, 0, 7, a.cap); row(2, 0, 7, shade(a.cap, -.25)); set(3, 1, '#fff'); set(4, 1, '#fff'); set(0, 3, H); set(7, 3, H) }
  } else {
    row(0, 0, 7, shade(S, .08))
  }
  // olhos
  set(1, 4, '#ffffff'); set(2, 4, a.e); set(5, 4, a.e); set(6, 4, '#ffffff')
  // sobrancelha
  if (a.style !== 'cap') { set(1, 3, shade(H, -.1)); set(2, 3, shade(H, -.1)); set(5, 3, shade(H, -.1)); set(6, 3, shade(H, -.1)) }
  // nariz / boca
  set(3, 5, shade(S, -.15)); set(4, 5, shade(S, -.15))
  set(3, 6, '#7a3b2e'); set(4, 6, '#7a3b2e')
  if (a.beard) { const B = a.beardC || H; row(6, 1, 2, B); row(6, 5, 6, B); row(7, 1, 6, B); set(0, 5, B); set(7, 5, B); set(0, 6, B); set(7, 6, B); set(0, 7, B); set(7, 7, B) }
  if (a.glasses) { set(1, 4, '#cfe8ff'); set(6, 4, '#cfe8ff'); row(3, 1, 6, '#1a1a1a'); set(0, 4, '#1a1a1a'); set(3, 4, '#1a1a1a'); set(4, 4, '#1a1a1a'); set(7, 4, '#1a1a1a') }
  if (a.headset) { row(0, 2, 5, a.headset); set(0, 3, a.headset); set(0, 4, a.headset); set(7, 3, a.headset); set(7, 4, a.headset); set(1, 6, a.headset) }
  return g
}
function rects(grid, ox, oy, u) {
  let s = ''
  grid.forEach((r, y) => r.forEach((c, x) => { if (c) s += `<rect x="${ox + x * u}" y="${oy + y * u}" width="${u}" height="${u}" fill="${c}"/>` }))
  return s
}
const avCache = {}
function avatarUrl(id, full) {
  const k = id + (full ? ':f' : ':h')
  if (avCache[k]) return avCache[k]
  const a = AVATARS.find(x => x.id === id) || AVATARS[0]
  let svg
  if (!full) {
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">${rects(headGrid(a), 0, 0, 1)}</svg>`
  } else {
    // corpo 16 x 32: cabeça 8x8, tronco 8x12, braços 4x12, pernas 4x12
    let b = rects(headGrid(a), 4, 0, 1)
    const sh = a.sh, shD = shade(sh, -.2), p = a.p, pD = shade(p, -.2)
    const torso = Array.from({length: 12}, (_, y) => Array.from({length: 8}, (_, x) => {
      if (a.flannel && (x + y) % 3 === 0) return shade(sh, -.35)
      if (a.tie && (x === 3 || x === 4) && y < 9) return y === 0 ? '#ffffff' : a.tie
      if (a.tie && (x === 2 || x === 5) && y < 2) return '#ffffff'
      if (a.style === 'robot' && y > 2 && y < 6 && x > 1 && x < 6) return (x + y) % 2 ? '#3ff0ff' : '#2e3338'
      if (a.id === 'fenix' && y > 2 && y < 7 && x > 1 && x < 6) return (y === 3 && (x === 2 || x === 5)) || y === 4 ? '#ffd23f' : (y > 4 && (x === 3 || x === 4)) ? '#ffd23f' : sh
      return y === 11 ? shD : sh
    }))
    b += rects(torso, 4, 8, 1)
    const arm = Array.from({length: 12}, (_, y) => Array.from({length: 4}, () => y < 4 ? sh : y === 11 ? shade(a.s, -.15) : a.s))
    const armR = arm.map(r => r.map((c, x) => x === 3 ? shade(c, -.12) : c))
    const armL = arm.map(r => r.map((c, x) => x === 0 ? shade(c, -.12) : c))
    b += rects(armL, 0, 8, 1) + rects(armR, 12, 8, 1)
    const leg = Array.from({length: 12}, (_, y) => Array.from({length: 4}, (_, x) => y >= 10 ? a.b : (x === 3 ? pD : p)))
    b += rects(leg, 4, 20, 1) + rects(leg.map(r => [...r].reverse()), 8, 20, 1)
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 32" shape-rendering="crispEdges">${b}</svg>`
  }
  return avCache[k] = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg)
}
const avOf = p => AVATARS.find(a => a.id === p.av) || AVATARS[0]
const nameColor = p => { const c = avOf(p).sh; return parseInt(c.slice(1, 3), 16) + parseInt(c.slice(3, 5), 16) + parseInt(c.slice(5, 7), 16) < 180 ? '#ffb23f' : c }

/* ---------------- utilidades ---------------- */
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]))

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },

const avatar = (p, cls = '') => `<span class="av ${cls}"><img src="${avatarUrl(p.av)}" alt=""></span>`
const fmtTime = ts => new Date(ts).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'})
const fmtDay = ts => new Date(ts).toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long'})

async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 24) }
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
const validAv = id => AVATARS.some(a => a.id === id) ? id : AVATARS[0].id

/* ---------------- brasas da tela de entrada ---------------- */
;(function embers() {
  const cv = $('embers'), ctx = cv.getContext('2d')
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  let W, H, parts = []
  const resize = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio }
  resize(); addEventListener('resize', resize)
  const spawn = () => ({x: Math.random() * W, y: H + 10, r: (Math.random() * 2.2 + .6) * devicePixelRatio, vy: (Math.random() * .9 + .4) * devicePixelRatio, vx: (Math.random() - .5) * .4, life: 0, max: 300 + Math.random() * 300, hue: 15 + Math.random() * 30})
  for (let i = 0; i < 70; i++) { const p = spawn(); p.y = Math.random() * H; parts.push(p) }
  function tick() {
    if ($('login').classList.contains('hidden')) return
    ctx.clearRect(0, 0, W, H)
    for (const p of parts) {
      p.life++; p.y -= p.vy; p.x += p.vx + Math.sin((p.life + p.hue) / 30) * .3
      const a = Math.max(0, 1 - p.life / p.max)
      ctx.beginPath(); ctx.fillStyle = `hsla(${p.hue},100%,${55 + a * 15}%,${a})`
      ctx.shadowColor = `hsla(${p.hue},100%,55%,${a})`; ctx.shadowBlur = 12
      ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill()
      if (p.life > p.max || p.y < -10) Object.assign(p, spawn())
    }
    if (!reduce) requestAnimationFrame(tick)
  }
  tick()
})()

async function start(name, av) {
  if (!name) return toast('Digite seu nome')
  me.name = name.slice(0, 24); me.av = validAv(av)
  store.set('vzn-name', me.name); store.set('vzn-av', me.av); store.set('vzn-ok', true)
  wsKey = await sha('vzn-agencia|' + PASSWORD)
  cfg = {appId: APP_ID, password: 'vzn-agencia-qg|' + PASSWORD}
  hist = store.get('vzn-hist', {})
  $('login').classList.add('hidden'); $('app').classList.remove('hidden')
  connectLobby()
  renderAll()
}

/* ---------------- lobby (presença + chat) ---------------- */
function connectLobby() {
  lobby = joinRoom(cfg, 'lobby-' + wsKey)
  act.st = lobby.makeAction('st')
  act.msg = lobby.makeAction('msg')
  act.hist = lobby.makeAction('hist')
  act.typ = lobby.makeAction('typ')

  lobby.onPeerJoin = id => {
    act.st.send(publicState(), {target: id})
    act.hist.send(historySnapshot(), {target: id})
  }
  lobby.onPeerLeave = id => {
    const p = peers[id]
    delete peers[id]; delete typingPeers[id]
    if (p) sysNote(`${p.name} saiu do QG`)
    renderSide(); renderMembers(); renderTyping(); if (me.voice) renderGrid(); refreshJoinScreen()
  }
  act.st.onMessage = (d, {peerId}) => {
    if (!d || typeof d.name !== 'string') return
    const prev = peers[peerId]
    peers[peerId] = {name: d.name.slice(0, 24), av: validAv(d.av), voice: VOICE_ROOMS.some(r => r.id === d.voice) ? d.voice : null, mic: !!d.mic, cam: !!d.cam, screen: !!d.screen, deaf: !!d.deaf}
    if (!prev) sysNote(`${peers[peerId].name} entrou no QG`)
    if (me.voice && peers[peerId].voice === me.voice && (!prev || prev.voice !== me.voice)) beep(660)
    renderSide(); renderMembers(); if (me.voice) renderGrid(); refreshJoinScreen()
  }
  act.msg.onMessage = (m, {peerId}) => { if (validMsg(m)) { delete typingPeers[peerId]; addMsg(m, true) } }
  act.hist.onMessage = snap => mergeHistory(snap)
  act.typ.onMessage = (d, {peerId}) => {
    if (!peers[peerId] || !d) return
    typingPeers[peerId] = {name: peers[peerId].name, ch: d.ch, until: Date.now() + 4000}
    renderTyping()
  }
}
const publicState = () => ({name: me.name, av: me.av, voice: me.voice, mic: me.mic, cam: me.cam, screen: me.screen, deaf: me.deaf})
function broadcastState() { act.st?.send(publicState()); renderSide(); renderMembers(); renderMe() }
const everyone = () => [{id: selfId, ...publicState()}, ...Object.entries(peers).map(([id, p]) => ({id, ...p}))]

/* ---------------- chat ---------------- */
function validMsg(m) {
  return m && typeof m.id === 'string' && m.id.length < 40 && typeof m.text === 'string' && typeof m.ch === 'string' &&
    TEXT_CHANNELS.some(c => c.id === m.ch) && m.text.length <= 4000 && typeof m.ts === 'number' && typeof m.name === 'string'
}
const clean = m => ({id: m.id, ch: m.ch, text: m.text, ts: m.ts, name: m.name.slice(0, 24), av: validAv(m.av)})
function addMsg(m, fromNet) {
  const list = hist[m.ch] ||= []
  if (list.some(x => x.id === m.id)) return
  list.push(clean(m)); list.sort((a, b) => a.ts - b.ts)
  if (list.length > HISTORY_LIMIT) list.splice(0, list.length - HISTORY_LIMIT)
  saveHistory()
  if (fromNet) {
    const viewing = view.type === 'text' && view.id === m.ch && !document.hidden
    if (!viewing) { unread[m.ch] = (unread[m.ch] || 0) + 1; store.set('vzn-unread', unread); beep(880, .05) }
    renderSide(); renderTyping(); updateTitle()
  }
  if (view.type === 'text' && view.id === m.ch) renderMsgs()
}
let saveT
function saveHistory() { clearTimeout(saveT); saveT = setTimeout(() => store.set('vzn-hist', hist), 400) }
function historySnapshot() { const s = {}; for (const c of TEXT_CHANNELS) s[c.id] = (hist[c.id] || []).slice(-150); return s }
function mergeHistory(snap) {
  if (!snap || typeof snap !== 'object') return
  let changed = false
  for (const c of TEXT_CHANNELS) {
    const inc = Array.isArray(snap[c.id]) ? snap[c.id] : []
    const list = hist[c.id] ||= []
    const ids = new Set(list.map(x => x.id))
    for (const m of inc) if (validMsg(m) && m.ch === c.id && !ids.has(m.id)) { list.push(clean(m)); ids.add(m.id); changed = true }
    list.sort((a, b) => a.ts - b.ts)
    if (list.length > HISTORY_LIMIT) list.splice(0, list.length - HISTORY_LIMIT)
  }
  if (changed) { saveHistory(); if (view.type === 'text') renderMsgs() }
}
function sysNote(t) {
  if (view.type !== 'text') return
  const el = document.createElement('div'); el.className = 'sysmsg'; el.textContent = '🔥 ' + t
  const box = $('msgs'); const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80
  box.appendChild(el); if (atBottom) box.scrollTop = box.scrollHeight
}
$('inMsg').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg() } })
$('sendForm').onsubmit = e => { e.preventDefault(); sendMsg() }
let lastTyp = 0
$('inMsg').addEventListener('input', e => {
  const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'
  if (Date.now() - lastTyp > 2500 && t.value) { lastTyp = Date.now(); act.typ?.send({ch: view.id}) }
})
function sendMsg() {
  const t = $('inMsg'); const text = t.value.trim()
  if (!text || view.type !== 'text') return
  const m = {id: uid(), ch: view.id, text: text.slice(0, 4000), ts: Date.now(), name: me.name, av: me.av}
  addMsg(m, false); act.msg.send(m)
  t.value = ''; t.style.height = 'auto'; lastTyp = 0; t.focus()
}

/* ---------------- render ---------------- */
function renderAll() { renderSide(); renderMembers(); renderMe(); renderView(); updateTitle() }
function renderSide() {
  let h = '<div class="cat">Canais de texto</div>'
  for (const c of TEXT_CHANNELS) {
    const on = view.type === 'text' && view.id === c.id, n = unread[c.id] || 0
    h += `<button class="ch ${on ? 'on' : ''} ${n ? 'unread' : ''}" data-t="text" data-id="${c.id}"><span class="ico">#</span><span class="nm">${esc(c.name)}</span>${n ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : ''}</button>`
  }
  h += '<div class="cat">Salas de voz e vídeo</div>'
  for (const r of VOICE_ROOMS) {
    const on = view.type === 'voice' && view.id === r.id
    const inRoom = everyone().filter(p => p.voice === r.id)
    h += `<button class="ch ${on ? 'on' : ''}" data-t="voice" data-id="${r.id}"><span class="ico">🔊</span><span class="nm">${esc(r.name)}</span>${inRoom.length ? `<span class="cnt">${inRoom.length}</span>` : ''}</button>`
    if (inRoom.length) h += '<div class="vmembers">' + inRoom.map(p => `<div class="vm" data-pid="${p.id}">${avatar(p, speaking.has(p.id) ? 'speak' : '')}<span>${esc(p.name)}</span><span class="flags">${p.screen ? '<span class="live">AO VIVO</span>' : ''}${p.cam ? '📷' : ''}${!p.mic ? '🔇' : ''}${p.deaf ? '🙉' : ''}</span></div>`).join('') + '</div>'
  }
  $('chanlist').innerHTML = h
  const vr = VOICE_ROOMS.find(r => r.id === me.voice)
  $('vpanel').classList.toggle('hidden', !vr)
  if (vr) { $('vwhere').textContent = vr.name; $('pCam').classList.toggle('act', me.cam); $('pScreen').classList.toggle('act', me.screen) }
}
function renderMembers() {
  const all = everyone()
  let h = `<div class="cat">Online agora — ${all.length}</div>`
  for (const p of all.sort((a, b) => a.name.localeCompare(b.name))) {
    const vr = VOICE_ROOMS.find(r => r.id === p.voice)
    const st = vr ? `🔊 ${vr.name}${p.screen ? ' · tela ao vivo' : ''}` : 'Online'
    h += `<div class="mem">${avatar(p)}<div class="info"><b style="color:${nameColor(p)}">${esc(p.name)}${p.id === selfId ? ' (você)' : ''}</b><span>${esc(st)}</span></div></div>`
  }
  $('members').innerHTML = h
}
function renderMe() {
  $('meAv').innerHTML = `<img src="${avatarUrl(me.av)}" alt="">`
  $('meName').textContent = me.name
  const vr = VOICE_ROOMS.find(r => r.id === me.voice)
  $('meStatus').textContent = vr ? '🔊 ' + vr.name : 'Online'
  $('bMic').classList.toggle('off', !me.mic); $('bDeaf').classList.toggle('off', me.deaf)
  $('vMic').classList.toggle('offc', !me.mic)
  $('vCam').classList.toggle('act', me.cam); $('vScreen').classList.toggle('act', me.screen)
}
function renderView() {
  const isText = view.type === 'text'
  $('chat').classList.toggle('hidden', !isText)
  $('voice').classList.toggle('hidden', isText)
  if (isText) {
    const c = TEXT_CHANNELS.find(x => x.id === view.id)
    $('tIco').textContent = '#'; $('tName').textContent = c.name; $('tDesc').textContent = c.desc
    $('inMsg').placeholder = 'Conversar em #' + c.name
    unread[c.id] = 0; store.set('vzn-unread', unread); updateTitle()
    renderMsgs(); renderTyping()
  } else {
    const r = VOICE_ROOMS.find(x => x.id === view.id)
    $('tIco').textContent = '🔊'; $('tName').textContent = r.name; $('tDesc').textContent = 'Voz, câmera e tela'
    const inside = me.voice === r.id
    $('vjoin').classList.toggle('hidden', inside)
    $('grid').classList.toggle('hidden', !inside); $('vbar').classList.toggle('hidden', !inside)
    if (inside) renderGrid(); else refreshJoinScreen()
  }
  renderSide()
}
function refreshJoinScreen() {
  if (view.type !== 'voice' || me.voice === view.id) return
  const r = VOICE_ROOMS.find(x => x.id === view.id)
  const n = everyone().filter(p => p.voice === r.id)
  $('vjFigs').innerHTML = n.slice(0, 6).map(p => `<img src="${avatarUrl(p.av, true)}" title="${esc(p.name)}" alt="">`).join('') || `<img src="${avatarUrl(me.av, true)}" style="opacity:.35" alt="">`
  $('vjTitle').textContent = r.name
  $('vjSub').textContent = n.length ? `Na sala agora: ${n.map(p => p.name).join(', ')}` : 'Ninguém aqui ainda. Entra e espera a equipe chegar.'
  $('vjBtn').textContent = me.voice ? 'Mudar para esta sala' : 'Entrar na sala'
}
function renderMsgs() {
  const c = TEXT_CHANNELS.find(x => x.id === view.id)
  const list = hist[c.id] || []
  let h = `<div class="welcome"><div class="big">#</div><h2>Bem-vindo(a) a #${esc(c.name)}</h2><p>${esc(c.desc)}.</p></div>`
  let prev = null, prevDay = ''
  for (const m of list) {
    const day = fmtDay(m.ts)
    if (day !== prevDay) { h += `<div class="daysep">${esc(day)}</div>`; prevDay = day; prev = null }
    const grouped = prev && prev.name === m.name && m.ts - prev.ts < 5 * 60e3
    if (grouped) h += `<div class="msg"><div class="gut">${fmtTime(m.ts)}</div><div class="body"><div class="tx">${linkify(m.text)}</div></div></div>`
    else h += `<div class="msg first">${avatar(m)}<div class="body"><div class="hd"><b style="color:${nameColor(m)}">${esc(m.name)}</b><time>${fmtTime(m.ts)}</time></div><div class="tx">${linkify(m.text)}</div></div></div>`
    prev = m
  }
  const box = $('msgs'); box.innerHTML = h; box.scrollTop = box.scrollHeight
}
function renderTyping() {
  const now = Date.now()
  const names = Object.values(typingPeers).filter(t => t.until > now && t.ch === view.id && view.type === 'text').map(t => t.name)
  $('typing').textContent = names.length ? `${names.join(', ')} ${names.length > 1 ? 'estão' : 'está'} digitando…` : ''
}
setInterval(renderTyping, 1500)
function updateTitle() { const n = Object.values(unread).reduce((a, b) => a + b, 0); document.title = (n ? `(${n}) ` : '') + 'VZN QG' }

/* ---------------- navegação ---------------- */
$('chanlist').onclick = e => {
  const b = e.target.closest('.ch'); if (!b) return
  view = {type: b.dataset.t, id: b.dataset.id}
  closeDrawers(); renderView()
}
$('vjBtn').onclick = () => joinVoice(view.id)
$('menuBtn').onclick = () => { $('side').classList.add('open'); $('overlay').classList.add('open') }
$('membersBtn').onclick = () => { $('members').classList.add('open'); $('overlay').classList.add('open') }
$('overlay').onclick = closeDrawers
function closeDrawers() { $('side').classList.remove('open'); $('members').classList.remove('open'); $('overlay').classList.remove('open') }
document.addEventListener('visibilitychange', () => { if (!document.hidden && view.type === 'text') { unread[view.id] = 0; store.set('vzn-unread', unread); renderSide(); updateTitle() } })
$('inviteBtn').onclick = async () => {
  const link = location.origin + location.pathname
  try { await navigator.clipboard.writeText(link); toast('Link do QG copiado! A senha é a mesma de sempre.') }
  catch { prompt('Copie o link do QG:', link) }
}
$('bOut').onclick = async () => {
  if (!confirm('Sair do QG neste computador?')) return
  await leaveVoice(); store.set('vzn-ok', false); location.reload()
}

/* ---------------- voz / câmera / tela ---------------- */
async function joinVoice(roomId) {
  if (me.voice === roomId) return
  if (me.voice) await leaveVoice(true)
  audioCtx ||= new (window.AudioContext || window.webkitAudioContext)()
  audioCtx.resume?.()
  try {
    localStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}})
  } catch {
    toast('Não consegui acessar o microfone. Você entrou só para ouvir.', 5000)
    localStream = new MediaStream(); me.mic = false
  }
  localStream.getAudioTracks().forEach(t => t.enabled = me.mic && !me.deaf)
  watchSpeaking(selfId, localStream)

  vroom = joinRoom(cfg, `voz-${wsKey}-${roomId}`)
  vroom.onPeerJoin = id => {
    vroom.addStream(localStream, {target: id})
    if (screenStream) vroom.addStream(screenStream, {target: id, metadata: {k: 'screen'}})
  }
  vroom.onPeerLeave = id => dropRemote(id)
  vroom.onPeerStream = (stream, id, meta) => gotStream(stream, id, meta)
  vroom.onPeerTrack = (track, stream, id, meta) => gotStream(stream, id, meta)

  me.voice = roomId
  view = {type: 'voice', id: roomId}
  beep(520); setTimeout(() => beep(780), 120)
  broadcastState(); renderView()
}
function gotStream(stream, id, meta) {
  const r = remote[id] ||= {}
  const kind = meta && meta.k === 'screen' ? 'screen' : 'cam'
  r[kind] = stream
  const attr = kind === 'cam' ? 'data-pid' : 'data-spid'
  let a = document.querySelector(`audio[${attr}="${CSS.escape(id)}"]`)
  if (!a) { a = document.createElement('audio'); a.autoplay = true; a.setAttribute(attr, id); $('audios').appendChild(a) }
  if (a.srcObject !== stream) a.srcObject = stream
  a.muted = me.deaf; a.play?.().catch(() => {})
  if (kind === 'cam' && !analysers.has(id)) watchSpeaking(id, stream)
  stream.onaddtrack = stream.onremovetrack = () => renderGrid()
  renderGrid()
}
function dropRemote(id) {
  delete remote[id]
  document.querySelectorAll(`audio[data-pid="${CSS.escape(id)}"],audio[data-spid="${CSS.escape(id)}"]`).forEach(a => { a.srcObject = null; a.remove() })
  analysers.delete(id); speaking.delete(id)
  renderGrid()
}
async function leaveVoice(switching) {
  if (!me.voice) return
  stopScreen(true)
  if (camTrack) { camTrack.stop(); camTrack = null }
  localStream?.getTracks().forEach(t => t.stop()); localStream = null
  try { await vroom?.leave() } catch {}
  vroom = null
  for (const id of Object.keys(remote)) dropRemote(id)
  analysers.clear(); speaking.clear(); focusKey = null
  $('grid').innerHTML = ''
  me.voice = null; me.cam = false; me.screen = false
  if (!switching) { beep(780); setTimeout(() => beep(520), 120); broadcastState(); renderView() }
}
async function toggleCam() {
  if (!me.voice) return toast('Entre numa sala primeiro')
  if (camTrack) {
    vroom.removeTrack(camTrack); localStream.removeTrack(camTrack); camTrack.stop(); camTrack = null; me.cam = false
  } else {
    try {
      const s = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 640}, height: {ideal: 360}, frameRate: {ideal: 20}}})
      camTrack = s.getVideoTracks()[0]
      localStream.addTrack(camTrack); vroom.addTrack(camTrack, localStream)
      me.cam = true
    } catch { return toast('Não consegui acessar a câmera.') }
  }
  broadcastState(); renderGrid()
}
async function toggleScreen() {
  if (!me.voice) return toast('Entre numa sala primeiro')
  if (screenStream) return stopScreen()
  if (!navigator.mediaDevices.getDisplayMedia) return toast('Este aparelho não compartilha tela. Use um computador.')
  try { screenStream = await navigator.mediaDevices.getDisplayMedia({video: {frameRate: {ideal: 15}}, audio: true}) } catch { return }
  screenStream.getVideoTracks()[0].onended = () => stopScreen()
  vroom.addStream(screenStream, {metadata: {k: 'screen'}})
  me.screen = true; focusKey = selfId + ':screen'
  broadcastState(); renderGrid()
}
function stopScreen(silent) {
  if (!screenStream) return
  try { vroom?.removeStream(screenStream) } catch {}
  screenStream.getTracks().forEach(t => t.stop()); screenStream = null
  me.screen = false
  if (focusKey === selfId + ':screen') focusKey = null
  if (!silent) { broadcastState(); renderGrid() }
}
function toggleMic() {
  if (me.voice && !localStream?.getAudioTracks().length) return toast('Microfone não disponível')
  me.mic = !me.mic
  if (me.mic && me.deaf) return setDeaf(false)
  localStream?.getAudioTracks().forEach(t => t.enabled = me.mic && !me.deaf)
  broadcastState()
}
function setDeaf(v) {
  me.deaf = v
  document.querySelectorAll('#audios audio').forEach(a => a.muted = v)
  localStream?.getAudioTracks().forEach(t => t.enabled = me.mic && !me.deaf)
  broadcastState()
}
$('bMic').onclick = $('vMic').onclick = toggleMic
$('bDeaf').onclick = () => setDeaf(!me.deaf)
$('vCam').onclick = $('pCam').onclick = toggleCam
$('vScreen').onclick = $('pScreen').onclick = toggleScreen
$('vLeave').onclick = $('pLeave').onclick = () => leaveVoice()
addEventListener('beforeunload', () => { try { vroom?.leave(); lobby?.leave() } catch {} })

const liveVideo = s => s?.getVideoTracks().filter(t => t.readyState === 'live').pop() || null
function renderGrid() {
  if (!me.voice) return
  const grid = $('grid'), tiles = []
  for (const p of everyone().filter(p => p.voice === me.voice)) {
    const isMe = p.id === selfId
    tiles.push({key: p.id + ':cam', p, track: isMe ? camTrack : (p.cam ? liveVideo(remote[p.id]?.cam) : null), screen: false, mirror: isMe})
    if (p.screen) tiles.push({key: p.id + ':screen', p, track: isMe ? screenStream?.getVideoTracks()[0] : liveVideo(remote[p.id]?.screen), screen: true})
  }
  if (focusKey && focusKey !== '__grid' && !tiles.some(t => t.key === focusKey)) focusKey = null
  let fk = focusKey
  if (fk === null) fk = tiles.find(t => t.screen && t.p.id !== selfId)?.key || null
  const keys = new Set(tiles.map(t => t.key))
  for (const el of [...grid.children]) if (!keys.has(el.dataset.key)) el.remove()
  for (const t of tiles) {
    let el = grid.querySelector(`[data-key="${CSS.escape(t.key)}"]`)
    if (!el) {
      el = document.createElement('div'); el.className = 'tile'; el.dataset.key = t.key
      el.innerHTML = '<img class="fig" alt=""><video autoplay playsinline muted></video><div class="tag"></div>'
      el.onclick = () => { focusKey = el.classList.contains('focus') ? '__grid' : t.key; renderGrid() }
      grid.appendChild(el)
    }
    el.classList.toggle('screen', t.screen)
    el.classList.toggle('focus', fk === t.key)
    el.dataset.pid = t.p.id
    const v = el.querySelector('video'), fig = el.querySelector('.fig')
    if (t.track) {
      if (v.srcObject?.getVideoTracks()[0] !== t.track) { v.srcObject = new MediaStream([t.track]); v.play?.().catch(() => {}) }
      v.style.display = ''; v.style.transform = t.mirror ? 'scaleX(-1)' : ''; fig.style.display = 'none'
    } else {
      v.srcObject = null; v.style.display = 'none'
      fig.style.display = t.screen ? 'none' : ''
      const src = avatarUrl(t.p.av, true); if (fig.getAttribute('src') !== src) fig.src = src
    }
    el.querySelector('.tag').innerHTML = `${t.screen ? '<span class="live">AO VIVO</span>' : ''}${esc(t.p.name)}${t.p.id === selfId ? ' (você)' : ''}${t.screen && !t.track ? ' · carregando…' : ''}${!t.screen && !t.p.mic ? ' 🔇' : ''}`
  }
  const hasFocus = tiles.some(t => t.key === fk)
  grid.classList.toggle('hasfocus', hasFocus)
  const n = hasFocus ? 1 : tiles.length
  let cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4
  cols = Math.max(1, Math.min(cols, Math.floor(grid.clientWidth / 240) || 1))
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`
  renderMe()
}
addEventListener('resize', () => me.voice && renderGrid())

/* quem está falando (anel verde + bonequinho pulando) */
function watchSpeaking(pid, stream) {
  if (!audioCtx || !stream.getAudioTracks().length) return
  try {
    const src = audioCtx.createMediaStreamSource(stream)
    const an = audioCtx.createAnalyser(); an.fftSize = 512; src.connect(an)
    analysers.set(pid, {an, buf: new Uint8Array(an.fftSize)})
  } catch {}
}
setInterval(() => {
  if (!me.voice) return
  let changed = false
  for (const [pid, {an, buf}] of analysers) {
    an.getByteTimeDomainData(buf)
    let sum = 0; for (const x of buf) { const d = (x - 128) / 128; sum += d * d }
    const muted = pid === selfId ? (!me.mic || me.deaf) : (peers[pid] && !peers[pid].mic)
    const loud = !muted && Math.sqrt(sum / buf.length) > 0.035
    if (loud !== speaking.has(pid)) { loud ? speaking.add(pid) : speaking.delete(pid); changed = true }
  }
  if (changed) {
    document.querySelectorAll('.tile').forEach(t => t.classList.toggle('speak', !t.classList.contains('screen') && speaking.has(t.dataset.pid)))
    document.querySelectorAll('.vm').forEach(v => v.querySelector('.av')?.classList.toggle('speak', speaking.has(v.dataset.pid)))
  }
}, 120)

function beep(freq, vol = .07) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)()
    const o = audioCtx.createOscillator(), g = audioCtx.createGain()
    o.frequency.value = freq; o.type = 'sine'
    g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .15)
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .16)
  } catch {}
}
</script>
